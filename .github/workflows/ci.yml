name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: dependency list is pinned
        run: ./scripts/deps-tight.sh
      - name: the drills can see a missing guardrail
        run: ./scripts/selftest.sh

      # You are asked to point an adversarial tool at your own production path
      # and believe the result, so the tool itself is what a careful reader pins
      # down first. CGO_ENABLED=0, -trimpath and -s -w hold that, here and in
      # release.yml, and any one going missing breaks it in silence.
      - name: a release can be rebuilt byte for byte
        run: ./scripts/reproducible-build.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...
