name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: dependency list is pinned
        run: ./scripts/deps-tight.sh

      # A number in a README is a claim with no owner: it is right the day it
      # is written and the suite grows in a commit that never opens the file.
      # On 2026-08-05 four of seven such figures on it-rat.com were found
      # stale against these repositories. This is the same check at the source.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh
      - name: the drills can see a missing guardrail
        run: ./scripts/selftest.sh

      # You are asked to point an adversarial tool at your own production path
      # and believe the result, so the tool itself is what a careful reader pins
      # down first. CGO_ENABLED=0, -trimpath and -s -w hold that, here and in
      # release.yml, and any one going missing breaks it in silence.
      - name: a release can be rebuilt byte for byte
        run: ./scripts/reproducible-build.sh

      # Last, because it mutates tracked files and restores them: anything
      # after it would run against a tree it had just rewritten and put back.
      # It needs a clean tree and says so plainly, so it also reports any
      # earlier step that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...
