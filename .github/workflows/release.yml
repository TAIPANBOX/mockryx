# Build and publish the container image to GitHub Container Registry.
#
#   ghcr.io/<owner>/mockryx:v0.1.0      what a deployment pins
#   ghcr.io/<owner>/mockryx:sha-abc123  what a bisect points at
#
# **Immutable versions, no moving tag.** There is deliberately no `:latest` and
# no `:main`: this is a plane of a governance stack, and "which build is
# running" has to have an answer that does not change under the operator. A tag
# that moves is a deployment whose contents change without a rollout anybody
# recorded (Yurii, 2026-08-02).
#
# Runs on a tag, never on a merge. Publishing on every push to main would mint
# artifacts nobody chose to release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mockryx
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo
          echo "platforms: linux/amd64, linux/arm64"
