# Weekly vulnerability scan of this module's dependencies.
#
# ci.yml runs the same govulncheck on every push and pull request. That covers
# what changes here, and nothing else: a new advisory against a dependency
# arrives without any push to this repository, and a scan that nothing invokes
# at that moment reports nothing. This run is the half that is invoked by the
# calendar. It fails the run on a finding, which GitHub mails to the owner.
#
# Public repository, standard runner: it costs nothing.
name: vulnscan

on:
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
