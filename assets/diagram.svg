<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 372" width="996" height="372" role="img" aria-label="Mockryx: hostile scenarios driven at the gateway, with the guardrails asserted">
  <title>Mockryx: hostile scenarios driven at the gateway, with the guardrails asserted</title>
  <rect x="-18" y="-18" width="996" height="372" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="371" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

        <defs><marker id="a3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/></marker></defs>
        <g font-family="ui-monospace,Menlo" text-anchor="middle">
          <rect x="16" y="24" width="200" height="188" rx="16" fill="#10161F" stroke="#FF8A5B" stroke-width="1.4"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.4s" repeatCount="indefinite"/></rect>
          <text x="116" y="50" fill="#FF8A5B" font-size="14" font-weight="700">mockryx CLI</text>
          <text x="116" y="66" fill="#8A97A6" font-size="10.5">one scenario = one YAML</text>
          <g font-size="10.5" fill="#E9EFF6">
            <rect x="32" y="76" width="168" height="22" rx="7" fill="#141C27" stroke="#2a3547"/><text x="116" y="90">request body</text>
            <rect x="32" y="102" width="168" height="22" rx="7" fill="#141C27" stroke="#2a3547"/><text x="116" y="116">expect.status &#183; header</text>
            <rect x="32" y="128" width="168" height="36" rx="7" fill="#141C27" stroke="#2a3547"/>
            <text x="116" y="142">expect.event</text>
            <text x="116" y="156" font-size="10.5" fill="#5A6675">source &#183; type &#183; &lt;10s</text>
          </g>
          <text x="116" y="184" fill="#5A6675" font-size="10.5">emits sim_run &#183; sim_finding</text>
          <text x="116" y="198" fill="#5A6675" font-size="10.5">outbound-only &#183; one target</text>

          <rect x="330" y="24" width="240" height="188" rx="16" fill="#10161F" stroke="#2a3547"/>
          <text x="450" y="50" fill="#E9EFF6" font-size="12.5" font-weight="700">your pre-prod gateway :8080</text>
          <text x="450" y="66" fill="#8A97A6" font-size="10.5">TokenFuse + Wardryx + DLP</text>
          <g font-size="10.5">
            <rect x="348" y="78" width="204" height="24" rx="7" fill="#141C27" stroke="#F4B23E"/><text x="450" y="93" fill="#F4B23E">TokenFuse breaker &#183; 402</text>
            <rect x="348" y="108" width="204" height="24" rx="7" fill="#141C27" stroke="#F4B23E"/><text x="450" y="123" fill="#F4B23E">DLP &#183; 403 on a secret shape</text>
            <rect x="348" y="138" width="204" height="24" rx="7" fill="#141C27" stroke="#2DD4BF"/><text x="450" y="153" fill="#2DD4BF">Wardryx PEP &#183; deny / hold</text>
          </g>
          <text x="450" y="184" fill="#5A6675" font-size="10.5">the real enforcement path</text>
          <text x="450" y="198" fill="#5A6675" font-size="10.5">never prod &#183; never anyone else's</text>

          <rect x="680" y="88" width="180" height="60" rx="12" fill="#141C27" stroke="#2a3547"/>
          <text x="770" y="112" fill="#E9EFF6" font-size="12.5" font-weight="700">fake provider</text>
          <text x="770" y="129" fill="#8A97A6" font-size="10.5">mock upstream &#183; $0 spend</text>

          <rect x="16" y="252" width="200" height="64" rx="12" fill="#10161F" stroke="#2a3547"/>
          <text x="116" y="274" fill="#E9EFF6" font-size="12" font-weight="700">report + exit code</text>
          <text x="116" y="291" fill="#8A97A6" font-size="10.5">human / json &#183; gates CI</text>
          <text x="116" y="305" fill="#FF8A5B" font-size="10.5">0 held &#183; 1 gap &#183; 2 broken</text>

          <rect x="330" y="252" width="240" height="64" rx="12" fill="#10161F" stroke="#2a3547"/>
          <text x="450" y="274" fill="#E9EFF6" font-size="12" font-weight="700">watch files</text>
          <text x="450" y="291" fill="#8A97A6" font-size="10.5">Verdryx / Idryx / Qryx NDJSON</text>
          <text x="450" y="305" fill="#8A97A6" font-size="10.5">polled every 200ms</text>

          <text x="269" y="106" fill="#5A6675" font-size="10.5">POST /v1/messages</text>
          <text x="458" y="232" fill="#5A6675" font-size="10.5" text-anchor="start">async reactions</text>
          <text x="272" y="240" fill="#5A6675" font-size="10.5">expect.event &#183; polled</text>
          <text x="770" y="282" fill="#5A6675" font-size="10.5">a drill on every merge,</text>
          <text x="770" y="298" fill="#5A6675" font-size="10.5">instead of a report once a year</text>
        </g>
        <g stroke="#5A6675" stroke-width="1.5" class="flow">
          <line x1="216" y1="118" x2="322" y2="118" marker-end="url(#a3)"/>
          <line x1="570" y1="118" x2="672" y2="118" marker-end="url(#a3)"/>
          <line x1="450" y1="212" x2="450" y2="244" marker-end="url(#a3)"/>
          <line x1="326" y1="250" x2="224" y2="214" marker-end="url(#a3)"/>
          <line x1="116" y1="212" x2="116" y2="244" marker-end="url(#a3)"/>
        </g>
      
  <g fill="none">
  <line x1="216" y1="118" x2="322" y2="118" pathLength="100" stroke="#FF8A5B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.00s" repeatCount="indefinite"/></line>
  <line x1="570" y1="118" x2="672" y2="118" pathLength="100" stroke="#FF8A5B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.37s" repeatCount="indefinite"/></line>
  <line x1="450" y1="212" x2="450" y2="244" pathLength="100" stroke="#FF8A5B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.74s" repeatCount="indefinite"/></line>
  <line x1="326" y1="250" x2="224" y2="214" pathLength="100" stroke="#FF8A5B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.11s" repeatCount="indefinite"/></line>
  <line x1="116" y1="212" x2="116" y2="244" pathLength="100" stroke="#FF8A5B" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.48s" repeatCount="indefinite"/></line>
  </g>
</svg>
