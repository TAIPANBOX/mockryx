# mcp-secret-in-arguments: a fire drill for a raw credential in an MCP tool call.
# (OWASP Top 10 for LLM Applications 2025: LLM02:2025 Sensitive Information
# Disclosure.)
#
# Defensive intent: this sends the operator's OWN MCP broker a tools/call whose
# arguments carry what looks like a live credential: AWS's own well-known,
# publicly documented, non-functional example access key, used throughout AWS's
# documentation, never a real secret. It rehearses "what happens if one of our
# agents pastes a credential into a tool's arguments", so we confirm the broker
# refuses the call before it reaches the MCP server behind it. It never targets
# any system other than the broker url passed with --mcp-broker, and the scenario
# format has no field a broker address could go in.
#
# THIS DRILL LIVES IN scenarios/mcp/, NOT scenarios/, ON PURPOSE.
#
# A plain `mockryx run ./scenarios` loads one directory and never recurses, so
# this is invisible to it, and that is the point. An mcp step needs a broker, and
# a run that loads one with no --mcp-broker refuses with exit 2 before sending
# anything. Putting it at the top level would turn every existing pipeline that
# runs the shipped scenarios against a gateway alone from green into a usage
# error. Run it deliberately:
#
#   mockryx run --gateway http://127.0.0.1:4100 --mcp-broker http://127.0.0.1:4200 scenarios/mcp
#
# (--gateway is still required; no step in this directory sends it anything.)
#
# THE SCAN IS OPT-IN, AND THIS IS HOW A BROKER WITH IT OFF IS READ.
#
# The broker scans tool arguments for raw secrets only when TOKENFUSE_MCP_DLP is
# `warn` or `block`; this drill rehearses `block`, which answers a JSON-RPC
# error -32002 "blocked: raw secret in tool arguments". With the scan off the
# broker forwards the call and returns the MCP server's own result.
#
# The broker stamps no x-fuse-* header on a reply, so the signal that decides
# "not configured" is the reply itself: a JSON-RPC error whose code is one the
# broker reserves for its own guardrails (-32001 to -32010). If no reply in this
# scenario ever carries one, the drill reports skipped_not_configured and not a
# Finding. The consequence to read before trusting a skip: a broker whose scan
# is off, and one whose scan is on but let this through, answer identically on
# the wire. The same is true of `warn` mode, which logs and forwards. An operator
# who has decided the scan MUST block passes --fail-on-skip, which turns that
# skip into a Finding and a failing run.
#
# A different guardrail speaking instead is a Finding, not a skip: a policy gate
# (-32004) that stopped the call is the broker plainly governing while the secret
# scan did not hold.
#
# `error_contains: blocked` is there because the MCP specification gives -32002
# a meaning of its own (a resource that was not found). An MCP server behind the
# broker could raise that very number, and a code alone would pass on an error
# the broker's scan never raised. Every refusal the broker writes starts with
# "blocked", and the drill asserts nothing more of the wording.
name: mcp-secret-in-arguments
requires: mcp-dlp
description: >
  An agent pastes what looks like a live AWS credential (a well-known,
  publicly documented placeholder, not a real key) into the arguments of an MCP
  tools/call. The broker's DLP, in block mode, should refuse the call before it
  reaches the MCP server, with JSON-RPC error -32002.
steps:
  - name: raw-secret-in-tool-arguments
    mcp:
      method: tools/call
      params:
        name: search_notes
        arguments:
          query: "invoice 4471, my key is AKIAIOSFODNN7EXAMPLE, can you use it to fetch the file?"
    headers:
      agent_id: agent://mockryx.local/rehearsal/notetaker
    expect:
      error_code: -32002
      error_contains: blocked
