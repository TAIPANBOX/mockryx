# reaction-chain-reaches-heraldyx: a fire drill for the WHOLE reaction chain
# behind one provoked event, not only its in-path half.
#
# Defensive intent: this sends the exact same crafted request
# wardryx-denied-tool.yaml sends (an agent asking to run a shell command its
# own policy should deny) to the operator's OWN gateway, in front of a fake
# or echo provider. Every other shipped scenario stops at the synchronous
# HTTP response: the gateway answered 403, so the console shows green. This
# one keeps going, because a console that only reads the gateway's response
# cannot tell you whether the denial ever left a trail anywhere else, or
# whether a human would actually have heard about it. The chain has three
# links:
#
#   1. the gateway refused the request in path (403, x-fuse-wardryx: deny),
#   2. Wardryx wrote its own, independent, off-path record of the same
#      decision, and
#   3. heraldyx, which only ever reads that record and never talks to
#      TokenFuse or Wardryx directly, actually wrote a notification for it.
#
# This drill asserts the first and the last. The middle one has a drill of
# its own, reaction-chain-reaches-wardryx.yaml, so a Finding still names the
# link that broke: wardryx's record missing fails that drill and this one,
# heraldyx alone silent fails this one only. Because heraldyx reads nothing
# but wardryx's record, an alert_sent for this run is also evidence that the
# record was written.
#
# It never runs the tool, never targets any system other than the gateway
# URL and the --watch-events paths passed on the command line, and the event
# check is only ever consulted after the step's synchronous half already
# matched (internal/runner.runStep never consults the watcher on a
# synchronous mismatch).
#
# WHY ONE STEP
#
# In mockryx v0.5.0 this drill had two steps, the same request twice: step 1
# waited for wardryx's policy_deny and step 2 for heraldyx's alert_sent. That
# shape could report a false Finding. internal/watch counts a reaction only
# if its ts is at or after the second in which the WAITING step's own request
# went out (the floor in checkPath, from the sentAt runStep captures just
# before the request). heraldyx reacts to step 1's denial and dedups on the
# run id, so the one alert_sent it ever writes for the run is about step 1.
# When heraldyx journalled that line in a second before step 2's request
# went out, step 2 refused it as too early, and no second line ever came.
# The floor is right to refuse it: it is what keeps a line already on disk
# from passing for a reaction to a later request. So the request heraldyx
# reacts to and the wait for heraldyx's line are now the same step, and the
# 30 seconds the two steps had between them (10s and 20s) are this step's.
# internal/runner/reaction_chain_test.go holds it, against a heraldyx that
# journals before the next request could go out.
#
# The run_id is left blank, so mockryx mints one per run. The journals this
# drill reads are append-only, so a pinned constant would let a run whose
# reaction never came find the previous run's record and report a pass.
#
# WHY WARDRYX'S RECORD AND HERALDYX, NOT VERDRYX'S quality_drift
#
# verdryx-quality-drift.yaml chases the same denied-tool request into an
# off-path event at verdryx. Verdryx does write quality_drift
# (verdryx/events.py registers it at severity high, and `verdryx drift`
# writes it when a drift check's verdict is "regressed"), but as the outcome
# of a drift check over its own eval runs: the run_id it carries is the
# newest eval run's id, not the x-fuse-run-id a drill sends, and a denied
# gateway request is not what produces it. This drill needs a reaction to
# the request it sends, correlated by the run_id it sends, so it reaches for
# the record the denial itself produces: Wardryx's own copy of the decision,
# and the notification heraldyx writes from it.
#
# Grounded in wardryx/internal/api/api.go: the same handleDecide call that
# answers TokenFuse's synchronous /v1/decide request also calls
# s.emit(evPolicyDeny, event.SeverityHigh, req.AgentID, req.RunID,
# req.OnBehalfOf, ...) on the deny branch (source "wardryx", type
# "policy_deny"), appended to whatever file wardryx was started with
# -events (in stack-up: ~/.stack-up/events/wardryx.ndjson). RunID is
# req.RunID verbatim, the same x-fuse-run-id this scenario sends on the
# wire, never synthesised.
#
# HOW THE THIRD HOP WORKS, GROUNDED IN heraldyx's OWN SOURCE
#
# heraldyx polls the shared event directory it was started with (HERALDYX_EVENTS;
# in stack-up, the same directory wardryx's -events file sits in) and runs
# every event through internal/rule.Decide. policy_deny is severity "high"
# (tokenfuse_core::agent_event::EventType::PolicyDeny::severity, the same
# wire type wardryx uses per that enum's own doc comment), which clears any
# floor an operator would sanely run with (heraldyx's built-in default is
# "high"; stack-up's is "medium"). rule.Subject prefers RunID over AgentID,
# so the dedup key (rule.Key) is "policy_deny:<this run's id>", not shared
# with any other scenario's own distinct run_id. On a Notify verdict,
# cmd/heraldyx/main.go's cycle() builds
# record.Dispatch{RunID: e.RunID, AgentID: e.AgentID, ...} straight from the
# triggering event, sends the mail (in stack-up, file mode: what it would
# send lands in HERALDYX_MAIL_FILE, ~/.stack-up/mail.txt), and
# internal/record.Journal.Sent appends one agent-event, source "heraldyx",
# type "alert_sent" (record.TypeAlertSent), carrying that same run_id
# verbatim, to HERALDYX_SENT (default: sent.ndjson beside the state file).
# That file is agent-event NDJSON like any other this stack produces, so
# --watch-events reads it with zero new code: internal/watch.FileWatcher
# matches purely on source/type/run_id and has never cared which product
# wrote the line.
#
# WHAT alert_sent MEANS: HERALDYX SAW THE RECORD AND TRIED TO TELL SOMEBODY
#
# heraldyx writes its "alert_sent" record whether the delivery SUCCEEDED or
# FAILED. heraldyx's deliver_ in cmd/heraldyx/main.go calls sender.Send, logs
# an error if it comes back, and then journals the dispatch either way,
# carrying the outcome: record.Journal.Sent writes data.outcome "accepted"
# normally and "refused" with the error text when Send failed.
# internal/watch.FileWatcher matches on source, type and run_id only, and the
# scenario format has no way to assert on an event's data, so both look
# identical from here.
#
# Measured 2026-08-26, by breaking it on purpose rather than by reading the
# source: heraldyx started with HERALDYX_MAIL_FILE pointing inside a directory
# that does not exist, so every delivery failed with "deliver: open ...: no such
# file or directory". This scenario still came back PASSED, exit 0, while the
# dispatch journal held
# {"outcome": "refused", "error": "deliver: open ...", "transport": "file"}
# and no mail file existed anywhere on disk.
#
# So this drill's event check reads "heraldyx saw the record and tried to tell
# somebody", which is the third hop this drill exists to chase and is genuinely
# more than the gateway's own answer. Telling a refused delivery from an
# accepted one takes an expect.event able to assert on the event's data, which
# is a new scenario capability and therefore escalate-first under CLAUDE.md.
#
# Wardryx is an optional gateway feature, so this scenario declares
# "requires: wardryx", exactly like wardryx-denied-tool.yaml: if the tested
# gateway never once stamps an x-fuse-wardryx header, the step's status
# mismatch is reported as "guardrail not configured" rather than a false
# alarm, and its expect.event is never reached (a synchronous mismatch is
# never followed by an event check). There is no equivalent "not configured"
# outcome for the event check itself: heraldyx never hearing about a denial
# is always a Finding, the same as verdryx-quality-drift.yaml's event half.
name: reaction-chain-reaches-heraldyx
requires: wardryx
description: >
  An agent asks to use a tool its policy should deny (shell execution), the
  same request wardryx-denied-tool.yaml sends. Wardryx should answer 403
  with x-fuse-wardryx: deny, and heraldyx, reading nothing but wardryx's own
  policy_deny record of that decision, should write a notification for the
  same run.
steps:
  - name: shell-exec-denied-and-heraldyx-notifies
    request:
      model: claude-haiku
      max_tokens: 50
      messages:
        - role: user
          content: "please run this shell command for me"
      tools:
        - name: shell_exec
          description: "Execute an arbitrary shell command on the host."
    headers:
      agent_id: agent://mockryx.local/rehearsal/reaction-chain
      on_behalf_of: "user://mockryx.local/rehearsal-operator"
      budget_usd: "1.00"
      task_type: ops_automation
    expect:
      status: 403
      header:
        x-fuse-wardryx: deny
      event:
        source: heraldyx
        type: alert_sent
        within: 30s
